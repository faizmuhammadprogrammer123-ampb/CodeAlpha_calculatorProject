<!-- Project-2: Build a calculator its codealpa internship project -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task2-Calculator</title>

</head>

<script>
      function pick(val) {
        document.getElementById("a").value +=val;
      }
      function clr() {
        document.getElementById("a").value = " ";
      }
       function solve() {
        var x=document.getElementById("a").value ;
        var y=eval(x);
        document.getElementById("a").value=y;
      }
</script>

<style>
    input[type="button"]
    {
        width: 100%;
        height: 100%;
    }
table , th, td{
    color: aqua;
    background-color: rgb(166, 174, 6);
    border: 10px solid black ;
    
    border-collapse: collapse;
    padding: 1px;
   
    margin-left: 2px;
    text-align: center;
    
}




</style>
<body>
    <table>
        <tr>
           <th colspan="3"><input type="text" id="a"></th>
           <th class="operator"><input type="button" value="C" onclick="clr()"></th>
        </tr>

        <tr>
            <th class="number"><input type="button" value="1" onclick="pick(1)"> </th>
            <th class="number"><input type="button" value="2" onclick="pick(2)"> </th>
            <th class="number"><input type="button" value="3" onclick="pick(3)"> </th>
            <th class="operator"><input type="button" value="/" onclick="pick('/')"> </th>
        </tr>

         <tr>
            <th class="number"><input type="button" value="4" onclick="pick(4)"></th>
            <th class="number"><input type="button" value="5" onclick="pick(5)"></th>
            <th class="number"><input type="button" value="6" onclick="pick(6)"></th>
            <th class="operator"><input type="button" value="*" onclick="pick('*')"></th>
        </tr>

         <tr>
            <th class="number"><input type="button" value="7" onclick="pick(7)"></th>
            <th class="number"><input type="button" value="8" onclick="pick(8)"></th>
            <th class="number"><input type="button" value="9" onclick="pick(9)"></th>
            <th class="operator"><input type="button" value="-" onclick="pick('-')"></th>
        </tr>
        
        <tr>
            <th class="operator"><input type="button" value="." onclick="pick('.')"></th>
            <th class="number"><input type="button" value="0" onclick="pick(0)"></th>
            <th class="operator"><input type="button" value="=" onclick="solve()"></th>
            <th class="operator"><input type="button" value="+" onclick="pick('+')"></th>
        </tr>
    </table>
</body>
</html>
